name: CI Verify

# The single source of truth for "is this code releasable?" — lint, format, the
# hermetic unit suite, and a packaging build. It PUBLISHES nothing; it only verifies
# (the sdist/wheel built here are discarded — no artifact upload, no PyPI).
#
# Reusable (workflow_call) so the exact same checks run in two places and can never
# drift apart:
#   * pr-check.yml  — on every pull request, so developers get pass/fail + logs and
#                     can iterate before merge.
#   * release.yml   — as the verify gate before a PyPI publish, so main is never
#                     released red.
#
# A green PR check therefore guarantees the release pipeline's verify gate will also
# pass: they run identical steps.

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # Scope to the shipped package: examples/ are standalone teaching projects
      # with their own requirements.txt and aren't part of the ojin-client wheel,
      # so their lint/format debt must not block a PR or a library release.
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest tests/stv # hermetic unit suite; skips live integration
      # Blocking: prove the package actually builds (sdist + wheel). Catches
      # packaging errors — bad pyproject metadata, files missing from the sdist,
      # build-backend misconfig — at PR time instead of at release time in
      # release.yml's build job. The output is discarded here (not uploaded, not
      # published); we only care that the build succeeds.
      - run: uv build
      # Advisory only: src/ojin carries known pyright type debt (untyped params,
      # missing super().__init__ calls). Surfaced here for cleanup, but it does
      # NOT block the PR or a release — CI has never gated on pyright.
      - name: Type-check (advisory, non-blocking)
        continue-on-error: true
        run: |
          source .venv/bin/activate
          uvx pyright

name: PR Check

# Runs the full CI verify suite (lint, format, unit tests, advisory type-check) on
# every pull request targeting main — everything the release pipeline does EXCEPT
# build and publish. This is the gate reviewers and branch protection watch: a green
# check means the branch is ready to merge and the release pipeline's own verify gate
# will pass too (it calls the same reusable workflow). Per-step logs are available in
# the Actions tab and inline on the PR's Checks panel, so developers can see exactly
# what failed and iterate.

on:
  pull_request:
    branches: [main]

# Newer pushes to the same PR cancel in-flight runs — no point finishing a check for
# a commit that's already been superseded.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci-verify.yml
